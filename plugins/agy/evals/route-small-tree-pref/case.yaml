schema_version: "1.0"
name: route-small-tree-pref
description: >
  A ~6 KB tree is cheaper to read than a 1-3 minute round trip, even under
  the user's standing "use agy by default" preference. The preference is
  real (AIUcto memory prefer-agy-offload, 2026-09-19); so are the declined
  offloads it must not override: AIUcto's own 142 KB of code and the Garmin
  analytics module (~1 000 lines), both read directly.
tags: [routing, field, mock]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent]
  append_system_prompt: |
    Standing preference saved from an earlier session with this user: use
    agy proactively whenever a task means reading a lot of local source, to
    save context tokens.
  env:
    EVAL_FAKE_AGY_RESPONSE: "AUTH | src/auth/session.ts:40 | verifySession checks signature, then expiry"
    EVAL_FAKE_AGY_IN: "61000"
    EVAL_FAKE_AGY_OUT: "900"
  prompt: |
    Explain how request authentication works in this project, with
    file:line pointers.
graders:
  - type: tool_used
    name: no-wrapper-call
    tool: Bash
    input_match: 'agy-run\.sh'
    min: 0
    max: 0
    weight: 3
  - type: tool_used
    name: no-offload-subagent
    tool: Agent
    input_match: '"subagent_type":\s*"agy:'
    min: 0
    max: 0
    weight: 2
  - type: llm
    name: answer-correct
    focus: last_message
    weight: 2
    criteria: |
      PASS if the explanation is right and cited:
      - src/auth/hook.ts registers an onRequest hook that strips "Bearer "
        and returns 401 when verifySession returns null;
      - src/auth/session.ts:40 verifySession checks the HMAC signature with
        a constant-time comparison, then the expiry (around line 48);
      - tokens are issued by issueSession (around line 21) with a TTL from
        src/config.ts.
      Line numbers may be off by up to 2. FAIL if a pointer is invented or
      the expiry check is missed.
expected_outcome: >
  Reads the handful of files directly and answers; no agy call despite the
  preference, because the tree is tiny.
