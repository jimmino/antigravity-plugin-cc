# agy plugin — user-defined model aliases
#
# Copy to:  ~/.config/agy-plugin/aliases.conf
#   (or set AGY_ALIASES_FILE to point somewhere else)
#
# One alias per line. `name = target`, `name: target` and `name target` all
# work, and `#` starts a comment. The target may be:
#
#   - another alias (built-in or your own) — chained, up to 5 deep
#   - an exact model id        e.g. gemini-3.1-pro-high
#   - an exact display name    e.g. Claude Opus 4.6 (Thinking)
#   - a custom model you have configured in agy's own settings
#
# Run `/agy:models` to see what your agy build currently offers.
#
# This file is read from your user config only — never from a project you
# have checked out — so cloning a repository cannot change which model your
# prompts are sent to.

# ---------------------------------------------------------------- tiers ---
# The built-in tier aliases already cover most of this; redefine them here if
# you disagree with the defaults. A user alias shadows the built-in.
cheap    = fast          # newest Flash, low effort
workday  = balanced      # newest Flash, high effort
audit    = deep          # newest Pro, high effort

# ------------------------------------------------------------ by purpose ---
# Naming by *job* rather than by model keeps call sites stable when you change
# your mind about which model does that job well.
sweep    = fast          # wide, shallow reconnaissance
explain  = sonnet
critique = opus

# ----------------------------------------------------------------- pins ---
# Use an exact id when you need reproducibility and are willing to update it
# by hand. Everything else here follows the catalogue automatically.
# repro  = gemini-3.1-pro-high
